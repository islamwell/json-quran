    function getWordGroups(tokens) {
      const groups = [];
      let currentGroup = [];
      let currentWordId = null;

      tokens.forEach((token) => {
        const wId = token.word_id || token.id;
        if (wId !== currentWordId) {
          if (currentGroup.length > 0) {
            groups.push(currentGroup);
          }
          currentGroup = [token];
          currentWordId = wId;
        } else {
          currentGroup.push(token);
        }
      });
      if (currentGroup.length > 0) {
        groups.push(currentGroup);
      }
      return groups;
    }

        .reveal-deep-btn {

        /* Beneficial Meaning Card (Plain English, NO Jargon) */
        .beneficial-meaning-card {

        /* ── Continuous Mushaf Paragraph (Flowing Naturally) ── */
        .mushaf-paragraph {
          direction: rtl;
          unicode-bidi: embed;
          font-family: 'Amiri Quran', 'Amiri', serif;
          font-size: 3.5rem;
          line-height: 2.3;

        .ayah-end-medallion {

        }

        @keyframes pulseAyah {

        .trans-quote {

        /* ── Instant Inline Inspector (Zero Scrolling Required!) ── */
        .instant-inline-inspector {
          margin: 1.25rem 0 1rem 0;
          background: linear-gradient(135deg, #f8fbff 0%, #ffffff 100%);
          border: 2px solid #bfdbfe;
          border-radius: 18px;
          padding: 1.4rem 1.6rem;
          box-shadow: 0 4px 20px -4px rgba(37, 99, 235, 0.12);

        }

        @keyframes instantCardSlide {
          from { opacity: 0; transform: translateY(-8px) scale(0.99); }
          to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .instant-header {
          display: flex;
          align-items: center;
          justify-content: space-between;

          gap: 0.75rem;
          padding-bottom: 0.9rem;

        }

        .instant-word-badge {
          display: flex;

        }

        .instant-ar-text {

        .instant-location-pill {

        .instant-scroll-btn {

        .instant-irab-box {

        .instant-fact-chip {

        /* POS Color Mode */
        .pos-mode .verb-past { color: #1e40af; }
        .pos-mode .verb-present { color: #2563eb; }
        .pos-mode .verb-imperative { color: #0891b2; text-shadow: 0 0 20px rgba(8,145,178,0.4); }
        .pos-mode .noun { color: #059669; }
        .pos-mode .preposition { color: #7c3aed; }
        .pos-mode .particle { color: #6d28d9; }
        .pos-mode .negative { color: #dc2626; }
        .pos-mode .pronoun { color: #d97706; }

        /* Case Mode */
        .case-mode .case-marfoo { color: #2563eb; }
        .case-mode .case-mansoob { color: #059669; }
        .case-mode .case-majroor { color: #7c3aed; }
        .case-mode .case-mabni { color: #64748b; }

        /* Syntax Mode */
        .syntax-mode .syntax-inna { color: #d97706; }
        .syntax-mode .syntax-subject { color: #dc2626; }
        .syntax-mode .syntax-object { color: #059669; }
        .syntax-mode .syntax-verb { color: #0284c7; }
        .syntax-mode .syntax-predicate { color: #2563eb; }
        .syntax-mode .syntax-preposition { color: #7c3aed; }
        .syntax-mode .syntax-pronoun { color: #e11d48; }

        /* Animations */
        @keyframes pulsePast {
          0%, 100% { text-shadow: 0 0 0 rgba(30,64,175,0.2); }
          50% { text-shadow: 0 0 18px rgba(30,64,175,0.5); }
        }
        .pulse-past { animation: pulsePast 3s ease-in-out infinite; }

        /* ── Clickable Word Token ── */
        .gram-word {
          cursor: pointer;
          position: relative;
          display: inline-block;
          padding: 0.15rem 0.55rem;
          border-radius: 10px;
          transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
          user-select: none;
        }
        .gram-word:hover {
          background: rgba(59, 130, 246, 0.07);
          transform: translateY(-3px) scale(1.02);
          text-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .gram-word.is-selected {
          background: rgba(59, 130, 246, 0.12);
          outline: 2.5px solid #3b82f6;
          outline-offset: 2px;
          border-radius: 12px;
        }

        /* Tooltip */
        .gram-word::after {
          content: attr(data-tooltip);
          position: absolute;
          bottom: 125%;
          right: 50%;
          transform: translateX(50%);
          background: #0f172a;
          color: #f1f5f9;
          padding: 8px 14px;
          border-radius: 10px;
          white-space: nowrap;
          font-family: 'Plus Jakarta Sans', sans-serif;
          font-size: 0.78rem;
          font-weight: 500;
          opacity: 0;
          pointer-events: none;
          transition: opacity 0.2s ease, transform 0.2s ease;
          box-shadow: 0 8px 24px -4px rgba(0,0,0,0.3);
          z-index: 50;
          border: 1px solid rgba(255,255,255,0.08);
        }
        .show-tooltips .gram-word:hover::after {
          opacity: 1;
          transform: translateX(50%) translateY(-6px);
        }

        .verse-translation {
          margin-top: 1.5rem;
          color: #475569;
          font-size: 1.02rem;
          line-height: 1.65;
          border-top: 1px solid #f1f5f9;
          padding-top: 1rem;
          font-weight: 400;
          font-style: italic;

        .detail-inspector-inner {

        }

        @keyframes inspectorIn {
          from { opacity: 0; transform: translateY(16px) scale(0.98); }
          to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .inspector-header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          border-bottom: 1px solid #f1f5f9;

        .word-translit {

        .word-role-badge {

          color: #64748b;
          background: #f1f5f9;

        .ai-tutor-container {

          border-color: #e2e8f0;

        .edge-badge {
          background: #eff6ff;

                    </span>
                    <strong style={{ color: '#1e1b4b' }}>Cut Off (Al-Abtar)</strong>
                  </div>
                </div>
              </div>

              {/* Interactive Word-by-Word Pedagogical Quiz Card */}
              {selectedWordQuiz && (
                <div className="word-quiz-panel" style={{
                  marginTop: '1.75rem',
                  background: '#f8fafc',
                  border: '1px solid #e2e8f0',
                  borderRadius: '16px',
                  padding: '1.5rem',
                  boxShadow: '0 4px 6px -1px rgba(0, 0, 0, 0.05)'
                }}>
                  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '1rem', flexWrap: 'wrap', gap: '0.5rem' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '0.65rem' }}>
                      <span style={{ fontSize: '1.35rem' }}>🎯</span>
                      <h4 style={{ margin: 0, fontSize: '1.05rem', fontWeight: 800, color: '#0f172a' }}>
                        Word Mastery Quiz: <span style={{ fontFamily: "'Amiri Quran', 'Amiri', serif", color: '#2563eb', fontSize: '1.35rem' }}>{selectedToken.text}</span>
                      </h4>
                      <span style={{
                        background: '#dbeafe',
                        color: '#1e40af',
                        fontSize: '0.74rem',
                        fontWeight: 700,
                        padding: '3px 9px',
                        borderRadius: '9999px'
                      }}>
                        Ayah {selectedToken.id.split(':')[1]} • Word {selectedToken.word_order || selectedToken.id.split(':')[2]}
                      </span>
                    </div>
                    <div style={{ fontSize: '0.78rem', color: '#64748b', fontWeight: 600 }}>
                      High-Yield Linguistic Self-Test
                    </div>
                  </div>

                  <div style={{ fontSize: '0.96rem', fontWeight: 700, color: '#1e293b', marginBottom: '1rem', lineHeight: 1.55 }}>
                    {selectedWordQuiz.question}
                  </div>

                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(250px, 1fr))', gap: '0.75rem', marginBottom: '1rem' }}>
                    {selectedWordQuiz.options.map(opt => {
                      const isChosen = selectedWordAnswer?.id === opt.id;
                      let btnStyle = {
                        background: '#ffffff',
                        border: '1px solid #cbd5e1',
                        color: '#334155'
                      };
                      if (selectedWordAnswer) {
                        if (opt.correct) {
                          btnStyle = { background: '#ecfdf5', border: '2px solid #10b981', color: '#065f46', fontWeight: 700 };
                        } else if (isChosen && !opt.correct) {
                          btnStyle = { background: '#fef2f2', border: '2px solid #ef4444', color: '#991b1b', fontWeight: 700 };
                        }
                      }
                      return (
                        <button
                          key={opt.id}
                          onClick={() => {
                            if (!selectedWordAnswer) {
                              setQuizAnswers(prev => ({ ...prev, [selectedWordQuiz.id]: opt }));
                            }
                          }}
                          style={{
                            padding: '0.85rem 1rem',
                            borderRadius: '10px',
                            fontSize: '0.86rem',
                            cursor: selectedWordAnswer ? 'default' : 'pointer',
                            textAlign: 'left',
                            transition: 'all 0.15s ease',
                            lineHeight: 1.45,
                            ...btnStyle
                          }}
                        >
                          <div style={{ display: 'flex', gap: '0.5rem' }}>
                            <span style={{ fontWeight: 700, opacity: 0.7 }}>{opt.id.toUpperCase()}.</span>
                            <span>{opt.text}</span>
                          </div>
                        </button>
                      );
                    })}
                  </div>

                  {selectedWordAnswer && (
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '0.75rem', marginTop: '1rem' }}>
                      <div style={{
                        padding: '0.85rem 1.15rem',
                        borderRadius: '10px',
                        background: selectedWordAnswer.correct ? '#f0fdf4' : '#fff1f2',
                        border: selectedWordAnswer.correct ? '1px solid #bbf7d0' : '1px solid #fecdd3',
                        fontSize: '0.84rem',
                        lineHeight: 1.55,
                        color: selectedWordAnswer.correct ? '#166534' : '#9f1239'
                      }}>
                        <strong>{selectedWordAnswer.correct ? '✓ Correct!' : '✕ Note:'}</strong> {selectedWordAnswer.explanation}
                      </div>

                      <div style={{
                        padding: '0.85rem 1.15rem',
                        borderRadius: '10px',
                        background: '#eff6ff',
                        border: '1px solid #bfdbfe',
                        fontSize: '0.84rem',
                        lineHeight: 1.55,
                        color: '#1e40af'
                      }}>
                        <strong style={{ display: 'flex', alignItems: 'center', gap: '0.35rem', marginBottom: '0.35rem', color: '#1d4ed8', fontSize: '0.88rem' }}>
                          <span>💡</span> Why this is a good question (Pedagogical Rationale):
                        </strong>
                        {selectedWordQuiz.why_this_is_a_good_question}
                      </div>
                    </div>
                  )}
                </div>
              )}
              </div>
            </section>
          )}

          {showQuiz && (
            <section style={{
              width: '100%',
              maxWidth: '1080px',
              margin: '2rem auto 0',
              padding: '2rem',
              background: '#ffffff',
              border: '1px solid #e2e8f0',
              borderRadius: '20px',
              boxShadow: '0 10px 25px -5px rgba(0,0,0,0.05)'
            }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1.5rem', borderBottom: '1px solid #f1f5f9', paddingBottom: '1rem', flexWrap: 'wrap', gap: '0.5rem' }}>
                <div>
                  <h2 style={{ fontSize: '1.25rem', fontWeight: 800, color: '#0f172a', margin: 0, display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                    <span>🎓</span> Surah Al-Kawthar Master Linguistic Challenge
                  </h2>
                  <p style={{ fontSize: '0.82rem', color: '#64748b', margin: '4px 0 0' }}>
                    Test your understanding of Sarf patterns, Nahw roles, and rhetorical secrets.
                  </p>
                </div>
                <div style={{
                  background: '#eff6ff',
                  color: '#2563eb',
                  padding: '0.35rem 0.85rem',
                  borderRadius: '9999px',
                  fontWeight: 700,
                  fontSize: '0.82rem',
                  fontFamily: "'JetBrains Mono', monospace"
                }}>
                  Score: {Object.values(quizAnswers).filter(a => a.correct).length} / {QUIZ_QUESTIONS.length}
                </div>
              </div>

              <div style={{ display: 'flex', flexDirection: 'column', gap: '1.5rem' }}>
                {QUIZ_QUESTIONS.map((q, idx) => {
                  const selectedOpt = quizAnswers[q.id];
                  return (
                    <div key={q.id} style={{ background: '#f8fafc', border: '1px solid #e2e8f0', borderRadius: '12px', padding: '1.25rem' }}>
                      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '0.75rem', flexWrap: 'wrap', gap: '0.5rem' }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                          <span style={{
                            background: '#dbeafe',
                            color: '#1e40af',
                            fontSize: '0.74rem',
                            fontWeight: 700,
                            padding: '2px 8px',
                            borderRadius: '9999px'
                          }}>
                            Ayah {q.ayah_num} • Word <span style={{ fontFamily: "'Amiri', serif", fontSize: '0.95rem' }}>{q.word_arabic}</span>
                          </span>
                          <span style={{ fontSize: '0.78rem', color: '#64748b', fontWeight: 600 }}>Token {q.token_id}</span>
                        </div>
                        <span style={{ fontSize: '0.78rem', fontWeight: 700, color: '#475569' }}>Question {idx + 1} of {QUIZ_QUESTIONS.length}</span>
                      </div>
                      <div style={{ fontSize: '0.96rem', fontWeight: 700, color: '#1e293b', marginBottom: '1rem', lineHeight: 1.55 }}>
                        {q.question}
                      </div>
                      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(240px, 1fr))', gap: '0.65rem' }}>
                        {q.options.map(opt => {
                          const isChosen = selectedOpt?.id === opt.id;
                          let btnStyle = {
                            background: '#ffffff',
                            border: '1px solid #cbd5e1',
                            color: '#334155'
                          };
                          if (selectedOpt) {
                            if (opt.correct) {
                              btnStyle = { background: '#ecfdf5', border: '2px solid #10b981', color: '#065f46', fontWeight: 700 };
                            } else if (isChosen && !opt.correct) {
                              btnStyle = { background: '#fef2f2', border: '2px solid #ef4444', color: '#991b1b', fontWeight: 700 };
                            }
                          }
                          return (
                            <button
                              key={opt.id}
                              onClick={() => {
                                if (!selectedOpt) {
                                  setQuizAnswers(prev => ({ ...prev, [q.id]: opt }));
                                }
                              }}
                              style={{
                                padding: '0.75rem 1rem',
                                borderRadius: '8px',
                                fontSize: '0.85rem',
                                cursor: selectedOpt ? 'default' : 'pointer',
                                textAlign: 'left',
                                transition: 'all 0.15s ease',
                                ...btnStyle
                              }}
                            >
                              <div style={{ display: 'flex', gap: '0.45rem' }}>
                                <span style={{ fontWeight: 700, opacity: 0.7 }}>{opt.id.toUpperCase()}.</span>
                                <span>{opt.text}</span>
                              </div>
                            </button>
                          );
                        })}
                      </div>
                      {selectedOpt && (
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '0.65rem', marginTop: '0.85rem' }}>
                          <div style={{
                            padding: '0.75rem 1rem',
                            borderRadius: '8px',
                            background: selectedOpt.correct ? '#f0fdf4' : '#fff1f2',
                            border: selectedOpt.correct ? '1px solid #bbf7d0' : '1px solid #fecdd3',
                            fontSize: '0.82rem',
                            lineHeight: 1.5,
                            color: selectedOpt.correct ? '#166534' : '#9f1239'
                          }}>
                            <strong>{selectedOpt.correct ? '✓ Correct!' : '✕ Note:'}</strong> {selectedOpt.explanation}
                          </div>

                          <div style={{
                            padding: '0.75rem 1rem',
                            borderRadius: '8px',
                            background: '#eff6ff',
                            border: '1px solid #bfdbfe',
                            fontSize: '0.82rem',
                            lineHeight: 1.5,
                            color: '#1e40af'
                          }}>
                            <strong style={{ display: 'flex', alignItems: 'center', gap: '0.35rem', marginBottom: '0.25rem', color: '#1d4ed8' }}>
                              <span>💡</span> Why this is a good question:
                            </strong>
                            {q.why_this_is_a_good_question}
                          </div>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </section>
          )}

          {copyToast && (
            <div style={{
              position: 'fixed',
              bottom: '2rem',
              right: '2rem',
              background: '#059669',
              color: '#ffffff',
              padding: '0.65rem 1.25rem',
              borderRadius: '8px',
              fontWeight: 600,
              fontSize: '0.85rem',
              boxShadow: '0 10px 20px rgba(0,0,0,0.15)',
              zIndex: 999
            }}>
              {copyToast}
            </div>
          )}

          <footer className="app-footer">
            <p className="footer-text">Surah Al-Kawthar — Grammar Intelligence & AI Tutor</p>
            <p className="footer-version">v1.1.4 (updated 2026-10-07 01:00)</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Surah108App />);
  </script>
</body>
</html>
